# Local development settings for the Supabase CLI (`supabase start`).
# Production auth settings are made in the Supabase dashboard; see README.

project_id = "mse-summit-workbook"

[api]
port = 54321

[db]
port = 54322
major_version = 15

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
# Accounts are pre-created from the Eventbrite export. Nobody signs themselves up.
enable_signup = false

[auth.email]
enable_signup = false
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Your Summit Workbook login"
content_path = "./supabase/templates/magic_link.html"
